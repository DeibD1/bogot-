<svg viewBox="0 0 860 1180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, Segoe UI, Roboto, sans-serif" role="img">
  <title>Flujograma del ciclo de vida de una oferta — Gestor de Ofertas</title>
  <desc>Flujo secuencial de 6 tramos: socialización (líder comercial), visita y especificaciones (líder de proyectos), cotización (compras), APUs (presupuestos), aprobación (líder de unidad) y envío al cliente (comercial). Si el líder rechaza, la oferta vuelve a corrección con uno o varios profesionales y regresa a aprobación cuando todos entregan.</desc>
  <rect x="0" y="0" width="860" height="1180" fill="#ffffff"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="flechaRoja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .t   { fill: #0f172a; font-size: 14px; font-weight: 600; }
    .r   { fill: #475569; font-size: 11.5px; }
    .lbl { fill: #475569; font-size: 11px; font-style: italic; }
    .ln  { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
    .lnR { stroke: #dc2626; stroke-width: 1.6; fill: none; }
  </style>

  <rect class="box" x="100" y="20" width="400" height="56" rx="28"/>
  <text class="t" x="300" y="44" text-anchor="middle">Líder comercial registra la oferta</text>
  <text class="r" x="300" y="62" text-anchor="middle">cliente · tamaño · fecha · días de socialización</text>

  <rect class="box" x="120" y="106" width="360" height="50" rx="8" stroke-dasharray="5 3"/>
  <text class="r" x="300" y="127" text-anchor="middle">El sistema genera automáticamente</text>
  <text class="r" x="300" y="143" text-anchor="middle">6 tramos, tareas y fechas en días hábiles</text>

  <rect class="box" x="140" y="186" width="320" height="54" rx="10"/>
  <text class="t" x="300" y="208" text-anchor="middle">T1 · Socialización de la oportunidad</text>
  <text class="r" x="300" y="226" text-anchor="middle">Líder comercial · 1 día hábil</text>

  <rect class="box" x="140" y="270" width="320" height="54" rx="10"/>
  <text class="t" x="300" y="292" text-anchor="middle">T2 · Visita técnica + recolección</text>
  <text class="r" x="300" y="310" text-anchor="middle">Líder de proyectos · 2-3 días</text>

  <rect class="box" x="140" y="354" width="320" height="54" rx="10"/>
  <text class="t" x="300" y="376" text-anchor="middle">T3 · Cotización de insumos</text>
  <text class="r" x="300" y="394" text-anchor="middle">Compras y contratación · 2-3 días</text>

  <rect class="box" x="140" y="438" width="320" height="54" rx="10"/>
  <text class="t" x="300" y="460" text-anchor="middle">T4 · APUs y precio de la oferta</text>
  <text class="r" x="300" y="478" text-anchor="middle">Presupuestos y control · 2-3 días</text>

  <rect class="box" x="160" y="522" width="280" height="44" rx="22" fill="#eef2ff"/>
  <text class="t" x="300" y="549" text-anchor="middle">Oferta pendiente de aprobación</text>

  <rect class="box" x="140" y="596" width="320" height="54" rx="10"/>
  <text class="t" x="300" y="618" text-anchor="middle">T5 · Revisión y aprobación</text>
  <text class="r" x="300" y="636" text-anchor="middle">Líder de la unidad · 1 día hábil</text>

  <polygon class="box" points="300,684 392,728 300,772 208,728"/>
  <text class="t" x="300" y="732" text-anchor="middle">¿Aprueba?</text>

  <rect class="box" x="140" y="812" width="320" height="54" rx="10"/>
  <text class="t" x="300" y="834" text-anchor="middle">T6 · Envío de la oferta al cliente</text>
  <text class="r" x="300" y="852" text-anchor="middle">Líder comercial · 1 día hábil</text>

  <rect class="box" x="120" y="900" width="360" height="56" rx="28" fill="#ede9fe"/>
  <text class="t" x="300" y="924" text-anchor="middle">Oferta FINALIZADA</text>
  <text class="r" x="300" y="942" text-anchor="middle">se calcula desviación e indicador (§11)</text>

  <rect class="box" x="600" y="586" width="230" height="74" rx="10" stroke="#dc2626"/>
  <text class="t" x="715" y="610" text-anchor="middle" fill="#b91c1c">Oferta RECHAZADA</text>
  <text class="r" x="715" y="628" text-anchor="middle">1 o varios motivos,</text>
  <text class="r" x="715" y="644" text-anchor="middle">cada uno a un tramo 1-4</text>

  <rect class="box" x="600" y="690" width="230" height="50" rx="10"/>
  <text class="r" x="715" y="711" text-anchor="middle">Cada profesional implicado</text>
  <text class="r" x="715" y="727" text-anchor="middle">corrige y entrega su parte</text>

  <polygon class="box" points="715,762 815,800 715,838 615,800"/>
  <text class="r" x="715" y="796" text-anchor="middle">¿Todos</text>
  <text class="r" x="715" y="810" text-anchor="middle">entregaron?</text>

  <path class="ln" d="M300,76 V106" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,156 V186" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,240 V270" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,324 V354" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,408 V438" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,492 V522" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,566 V596" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,650 V684" marker-end="url(#flecha)"/>
  <path class="ln" d="M300,772 V812" marker-end="url(#flecha)"/>
  <text class="lbl" x="312" y="792">Sí</text>
  <path class="ln" d="M300,866 V900" marker-end="url(#flecha)"/>

  <path class="lnR" d="M392,728 H560 Q600,728 600,700 V660" marker-end="url(#flechaRoja)"/>
  <text class="lbl" x="450" y="720" fill="#b91c1c">No</text>
  <path class="lnR" d="M715,660 V690" marker-end="url(#flechaRoja)"/>
  <path class="lnR" d="M715,740 V762" marker-end="url(#flechaRoja)"/>
  <path class="lnR" d="M815,800 H838 V715 H830" marker-end="url(#flechaRoja)"/>
  <text class="lbl" x="843" y="760" fill="#b91c1c">No</text>
  <path class="lnR" d="M715,838 V868 H540 Q440,868 440,560 V552" marker-end="url(#flechaRoja)"/>
  <text class="lbl" x="560" y="862" fill="#b91c1c">Sí, vuelve a aprobación</text>

  <text class="r" x="600" y="900" font-weight="600" fill="#0f172a">En cada entrega de tramo:</text>
  <text class="r" x="600" y="918">• desviación e indicador</text>
  <text class="r" x="600" y="934">• recálculo de fechas en cascada</text>
  <text class="r" x="600" y="950">• notificación al siguiente</text>
  <text class="r" x="600" y="966">• corrección se cuenta aparte (RN-19)</text>
</svg>
